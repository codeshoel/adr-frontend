name: Deploy frontend (VPS)

# Auto-deploy on every push to main, plus a manual "Run workflow" button.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      # Auth handled by the runner token — no git credentials needed on the VPS.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync code into the deploy dir
        run: |
          set -euo pipefail
          # Preserve the VPS's .env.local and the installed deps/build output.
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.env.local' \
            --exclude 'node_modules' \
            --exclude '.next' \
            ./ /var/www/html/frontend/adr-frontend/

      - name: Install, build, restart
        run: |
          set -euo pipefail
          cd /var/www/html/frontend/adr-frontend
          npm ci
          npm run build   # NEXT_PUBLIC_API_URL from .env.local is baked in here
          pm2 restart adr-frontend --update-env \
            || PORT=1908 pm2 start node_modules/next/dist/bin/next --name adr-frontend -- start -p 1908
          pm2 save

      - name: Health check
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:1908 || true)
            if [ "$code" = "200" ] || [ "$code" = "307" ]; then
              echo "frontend healthy ($code)"; exit 0
            fi
            echo "waiting for frontend… ($i, last=$code)"; sleep 3
          done
          echo "frontend health check FAILED"
          pm2 logs adr-frontend --lines 30 --nostream
          exit 1
